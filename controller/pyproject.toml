[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solstead"
version = "0.1.0"
description = "Solstead controller: local ownership, local recording."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyrage>=1.2"]

[project.scripts]
solstead = "solstead.cli:main"

[tool.setuptools.packages.find]
include = ["solstead*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"tools/*" = ["E501"]
